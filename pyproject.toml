[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "academicos-local"
version = "0.5.0"
description = "Ingesta documental local para academicOS"
requires-python = ">=3.11"
dependencies = ["markitdown[pdf,docx]>=0.1,<1", "rich>=13,<15", "pyyaml>=6,<7"]

[project.optional-dependencies]
test = ["python-docx", "reportlab"]

[project.scripts]
academicos = "academicos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
