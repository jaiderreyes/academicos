<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AcademicOS</title>
<style>
:root{--ink:#0B2A5B;--blue:#1F4FB4;--gold:#FFC83D;--mut:#5B6B85;--line:#E3E9F3}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 system-ui,Arial,sans-serif;color:var(--ink);background:#fff}
header{padding:18px 32px;border-bottom:4px solid var(--gold)}header h1{margin:0;font-size:28px}header small{color:var(--mut)}
main{display:grid;grid-template-columns:340px 1fr;gap:20px;padding:24px 32px;max-width:1400px;margin:auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.p{border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:16px}
h2{margin:0 0 12px;font-size:18px}label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;font-size:15px}
.btn{width:100%;margin-top:16px;background:var(--gold);color:var(--ink);border:0;padding:12px;border-radius:8px;font-weight:700;font-size:16px;cursor:pointer}
.btn:disabled{opacity:.5}.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px}.chk input{width:auto}
pre{background:#0B2A5B;color:#E3ECFF;padding:12px;border-radius:6px;max-height:200px;overflow:auto;font-size:13px;margin:0;white-space:pre-wrap}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:14px}.kpi b{display:block;font-size:30px;color:var(--blue)}.kpi span{color:var(--mut);font-size:13px}
.tw{max-height:420px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th{position:sticky;top:0;background:#F2F6FC;text-align:left;padding:8px;cursor:pointer}td{padding:7px 8px;border-top:1px solid var(--line)}
tr.r:hover{background:#FFF8E1}.pill{padding:2px 10px;border-radius:20px;font-weight:600;font-size:13px}.ok{background:#E3ECFF}.bad{background:#FFF1C2;color:#6B4A00}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px}.bar{flex:1;text-align:center;font-size:12px;color:var(--mut)}.bar i{display:block;background:var(--blue);border-radius:3px 3px 0 0;margin-bottom:3px}
</style></head><body>
<header><h1>AcademicOS</h1><small>Revisión asistida de entregas · todo se ejecuta en este equipo · la nota es solo una sugerencia</small></header>
<main><aside>
<div class="p"><h2>Nueva revisión</h2>
<label>Tipo</label><select id="tipo"><option value="course">Programa individual (Java)</option><option value="stack">Proyecto distribuido (docker compose)</option></select>
<label>Rúbrica</label><select id="rub"></select>
<label>Carpeta del curso (ruta completa)</label><input id="curso" placeholder="/Users/…/entregas">
<label>Equipos.yaml (opcional)</label><input id="eq" placeholder="manuales/equipos-….yaml">
<label>Carpeta de salida</label><input id="sal" value="reportes-gui">
<div class="chk"><input type="checkbox" id="nd" checked><span>Sin Docker (análisis estático)</span></div>
<button class="btn" id="go">Revisar</button></div>
<div class="p"><h2>Resultados guardados</h2><select id="rep"></select><button class="btn" id="ver" style="margin-top:10px">Abrir</button></div>
<div class="p"><h2>Registro</h2><pre id="log">Sin ejecuciones.</pre></div>
</aside>
<section><div class="kpis" id="kpis"></div>
<div class="p"><h2>Distribución de notas</h2><div class="bars" id="bars"></div></div>
<div class="p"><h2>Estudiantes</h2><input id="q" placeholder="Buscar…" style="margin-bottom:10px"><div class="tw"><table id="t"></table></div></div></section></main>
<script>
const $=i=>document.getElementById(i);let H=[],D=[],nc=-1,sc=-1,asc=true;
function parse(s){const R=[];let r=[],c="",q=false;for(let i=0;i<s.length;i++){const h=s[i];if(q){if(h=='"'){if(s[i+1]=='"'){c+='"';i++}else q=false}else c+=h}else if(h=='"')q=true;else if(h==","){r.push(c);c=""}else if(h=="\n"||h=="\r"){if(h=="\r"&&s[i+1]=="\n")i++;r.push(c);c="";if(r.length>1||r[0])R.push(r);r=[]}else c+=h}if(c||r.length){r.push(c);R.push(r)}return R}
const nv=r=>parseFloat(String(r[nc]).replace(",","."));
function load(txt){const p=parse(txt);H=p[0]||[];D=p.slice(1);nc=H.findIndex(h=>/nota_sugerida|nota_final/i.test(h));if(nc<0)nc=H.findIndex(h=>/nota/i.test(h));draw()}
function draw(){const v=D.map(nv).filter(x=>!isNaN(x)),n=v.length,avg=n?v.reduce((a,b)=>a+b,0)/n:0;
$("kpis").innerHTML=[[D.length,"estudiantes"],[avg.toFixed(2),"promedio"],[n?Math.round(100*v.filter(x=>x>=3).length/n)+"%":"–","con nota ≥ 3.0"],[n?Math.max(...v).toFixed(1):"–","máxima"]].map(k=>`<div class="kpi"><b>${k[0]}</b><span>${k[1]}</span></div>`).join("");
const b=[0,1,2,3,4].map(i=>v.filter(x=>x>=i&&(i==4?x<=5:x<i+1)).length),m=Math.max(1,...b);
$("bars").innerHTML=b.map((x,i)=>`<div class="bar"><i style="height:${x/m*90}px;${i<3?'background:#FFC83D':''}"></i>${x}<br>${i}–${i+1}</div>`).join("");tab()}
function tab(){const f=$("q").value.toLowerCase();let rows=D.filter(r=>r.join(" ").toLowerCase().includes(f));
if(sc>=0)rows.sort((a,b)=>{const x=parseFloat(a[sc]),y=parseFloat(b[sc]);const c=(!isNaN(x)&&!isNaN(y))?x-y:String(a[sc]).localeCompare(b[sc]);return asc?c:-c});
const cols=H.map((h,i)=>i).slice(0,6);if(nc>=0&&!cols.includes(nc))cols.push(nc);
$("t").innerHTML="<tr>"+cols.map(i=>`<th onclick="srt(${i})">${H[i]}</th>`).join("")+"</tr>"+rows.map(r=>"<tr class='r'>"+cols.map(i=>i==nc?`<td><span class="pill ${nv(r)>=3?'ok':'bad'}">${r[i]}</span></td>`:`<td>${r[i]}</td>`).join("")+"</tr>").join("")}
function srt(i){asc=sc==i?!asc:true;sc=i;tab()}$("q").oninput=tab;
async function cfg(){const c=await (await fetch("/api/config")).json();$("rub").innerHTML=c.rubricas.map(r=>`<option>${r}</option>`).join("");
$("rep").innerHTML=c.reportes.map(r=>`<option>${r}</option>`).join("")}
async function abrir(d){if(!d)return;load(await (await fetch("/api/csv?dir="+encodeURIComponent(d))).text())}
$("ver").onclick=()=>abrir($("rep").value);
$("go").onclick=async()=>{const r=await fetch("/api/run",{method:"POST",body:JSON.stringify({tipo:$("tipo").value,rubrica:$("rub").value,curso:$("curso").value,equipos:$("eq").value,salida:$("sal").value,no_docker:$("nd").checked})});
if(!(await r.json()).ok)alert("Falta la rúbrica o la carpeta, o ya hay una revisión en curso.");else poll()};
async function poll(){const s=await (await fetch("/api/log")).json();$("log").textContent=s.log.join("\n");$("log").scrollTop=1e9;$("go").disabled=s.corriendo;
if(s.corriendo)setTimeout(poll,1000);else if(s.codigo!==null){await cfg();$("rep").value=$("sal").value;abrir($("sal").value)}}
cfg().then(poll);
</script></body></html>
