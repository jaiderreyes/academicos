# Rúbrica del parcial "Bóveda de fichas" · Estructura de Datos I (UAJS)
# Derivada del enunciado (secciones 3, 7 y 10). Los niveles son acumulativos: para subir de
# nivel deben cumplirse los requisitos de ese nivel y los de los anteriores. Los niveles
# `manual: true` (excelente) solo los confirma la persona docente. `compila` es el paso de
# compilación; los demás ids son verificaciones, casos (casos/boveda-fichas) o requisitos.
nombre: Bóveda de fichas
escala: {min: 0.0, max: 5.0}
aprobacion: 3.0

# Invocación del enunciado:
#   javac -encoding UTF-8 -d out $(find src -name "*.java")
#   java -cp out app.Main datos/ejemplo_valido.txt
ejecucion:
  clase_principal: app.Main

# Carpeta (relativa a esta rúbrica) con los casos de prueba de la persona docente
casos: ../casos/boveda-fichas

criterios:
  - id: modelado
    nombre: Modelado y reglas
    peso: 25
    tipo: automatico
    niveles:
      - {nivel: deficiente, min: 0.0, max: 2.9, descripcion: Reglas incompletas o contradictorias}
      - nivel: regular
        min: 3.0
        max: 3.9
        descripcion: Identifica las fases (ejemplo válido y primer error de anidamiento)
        requiere: [compila, ejemplo_valido, err_cierre_incorrecto_f05]
      - nivel: bueno
        min: 4.0
        max: 4.4
        descripcion: Define flujo y casos límite coherentes (primer error correcto en todos los casos)
        requiere:
          - err_cierre_sin_apertura
          - err_apertura_sobrante
          - err_id_repetido
          - err_linea_incompleta
          - err_tipo_invalido
          - err_prioridad_fuera_rango
          - err_referencia_inexistente
          - err_referencia_no_letra
          - err_letra_repetida
      - {nivel: excelente, min: 4.5, max: 5.0, manual: true, descripcion: Justifica invariantes y demuestra determinismo}

  - id: estructuras
    nombre: Estructuras e integración
    peso: 30
    tipo: automatico
    niveles:
      - {nivel: deficiente, min: 0.0, max: 2.9, descripcion: No compila u omite una estructura o falla en tres prioridades o ENCADENAR}
      - nivel: regular
        min: 3.0
        max: 3.9
        descripcion: La implementación manual compila y demuestra lista, pila, P1/P2/P3 y ENCADENAR
        requiere: [compila, tipo_lista, tipo_pila, tipo_cola, ejemplo_valido, tres_prioridades,
                   fifo_misma_prioridad, encadenar_cola_con_pistas]
      - nivel: bueno
        min: 4.0
        max: 4.4
        descripcion: Integra además ambas variantes (manual y java.util) y casos límite
        requiere: [variante_biblioteca, biblioteca_usa_java_util, comparacion_variantes, err_apertura_sobrante]
      - {nivel: excelente, min: 4.5, max: 5.0, manual: true, descripcion: Mantiene invariantes y analiza costos}

  - id: validacion
    nombre: Validación y pruebas
    peso: 25
    tipo: automatico
    niveles:
      - {nivel: deficiente, min: 0.0, max: 2.9, descripcion: No demuestra tres prioridades y pista encadenada mediante ejecución}
      - nivel: regular
        min: 3.0
        max: 3.9
        descripcion: Pruebas reproducibles de P1/P2/P3 y ENCADENAR; faltan fronteras
        requiere: [compila, tiene_pruebas, tres_prioridades, encadenar_cola_con_pistas]
      - nivel: bueno
        min: 4.0
        max: 4.4
        descripcion: Cubre todos los casos mínimos y primer error correcto
        requiere:
          - ejemplo_valido
          - fifo_misma_prioridad
          - err_cierre_incorrecto_f05
          - err_cierre_sin_apertura
          - err_apertura_sobrante
          - err_id_repetido
          - err_linea_incompleta
          - err_tipo_invalido
          - err_prioridad_fuera_rango
          - err_referencia_inexistente
          - err_referencia_no_letra
          - err_letra_repetida
      - {nivel: excelente, min: 4.5, max: 5.0, manual: true, descripcion: Pruebas de regresión y trazas equivalentes}

  - {id: informe, nombre: Informe y defensa, peso: 20, tipo: manual}

condicion_minima:
  tope: 2.9
  requisitos:
    - {id: compila_manual, descripcion: La implementación manual compila, auto: compila}
    - {id: estructuras_basicas, descripcion: Usa lista, pila y cola implementadas por el estudiante}
    - {id: orden_prioridad_fifo, descripcion: Atiende P1 → P2 → P3 con FIFO dentro de cada prioridad}
    - {id: encadenar, descripcion: ENCADENAR inserta y procesa otra pista}

verificaciones:
  - {id: tipo_lista, tipo: requiere_tipo, nombres: ['\w*lista\w*'], requisito: estructuras_basicas, descripcion: Declara una lista (clase propia)}
  - {id: tipo_pila, tipo: requiere_tipo, nombres: ['\w*pila\w*'], requisito: estructuras_basicas, descripcion: Declara una pila (clase propia)}
  - {id: tipo_cola, tipo: requiere_tipo, nombres: ['\w*cola\w*'], requisito: estructuras_basicas, descripcion: Declara una cola (clase propia)}
  - {id: variante_biblioteca, tipo: requiere_tipo, nombres: ['\w*biblioteca\w*'], descripcion: Declara la variante con biblioteca}
  - id: biblioteca_usa_java_util
    tipo: requiere_patron
    patron: 'java\.util\.(?:(?:LinkedList|ArrayList|ArrayDeque|Stack|Queue|Deque|PriorityQueue|List)\b|\*)'
    archivos: '(?i)biblioteca'
    descripcion: La variante con biblioteca usa colecciones de java.util
  - {id: tiene_pruebas, tipo: requiere_tipo, nombres: ['\w*(prueba|test)\w*'], descripcion: Incluye pruebas del estudiante}
  - id: manual_sin_java_util
    tipo: prohibido_uso
    patron: 'import\s+java\.util\.(LinkedList|ArrayList|List|Stack|Queue|Deque|ArrayDeque|PriorityQueue|Vector)\b'
    archivos: '(?i)manual'
    descripcion: La versión manual no usa colecciones de java.util (informativa; el enunciado admite utilidades para leer el archivo)
