# Rúbrica del parcial "Bóveda de fichas" · Estructura de Datos I (UAJS)
nombre: Bóveda de fichas
escala: {min: 0.0, max: 5.0}
aprobacion: 3.0
criterios:
  - {id: modelado,      nombre: Modelado y reglas,          peso: 25, tipo: automatico}
  - {id: estructuras,   nombre: Estructuras e integración,  peso: 30, tipo: automatico}
  - {id: validacion,    nombre: Validación y pruebas,       peso: 25, tipo: automatico}
  - {id: informe,       nombre: Informe y defensa,          peso: 20, tipo: manual}
condicion_minima:
  tope: 2.9
  requisitos:
    - {id: compila_manual, descripcion: La versión manual compila}
    - {id: estructuras_basicas, descripcion: Usa lista, pila y cola implementadas por el estudiante}
    - {id: orden_prioridad_fifo, descripcion: Procesa P1 → P2 → P3 con FIFO dentro de cada prioridad}
    - {id: encadenar, descripcion: ENCADENAR inserta y procesa otra pista}

# Carpeta (relativa a la rúbrica) con los casos de prueba de la persona docente
casos: ../casos/boveda-fichas

verificaciones:
  - id: tipo_lista
    tipo: requiere_tipo
    nombres: ['\w*lista\w*']
    requisito: estructuras_basicas
    descripcion: Declara una lista (clase propia)
  - id: tipo_pila
    tipo: requiere_tipo
    nombres: ['\w*pila\w*']
    requisito: estructuras_basicas
    descripcion: Declara una pila (clase propia)
  - id: tipo_cola
    tipo: requiere_tipo
    nombres: ['\w*cola\w*']
    requisito: estructuras_basicas
    descripcion: Declara una cola (clase propia)
  - id: manual_sin_java_util
    tipo: prohibido_uso
    patron: 'import\s+java\.util\.(LinkedList|ArrayList|List|Stack|Queue|Deque|ArrayDeque|PriorityQueue|Vector)\b'
    archivos: '(?i)manual'
    descripcion: La versión manual no usa colecciones de java.util (informativa)
